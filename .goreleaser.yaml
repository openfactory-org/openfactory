# GoReleaser configuration: `make release` (on a tag) or `make snapshot`.
# It builds only the runtime binary. The control plane and the CLI are npm
# packages; the sandbox images and the kernel have their own release jobs.
version: 2
project_name: openfactory-runtime

before:
  hooks:
    - go mod download

builds:
  - id: openfactory-runtime
    main: ./cmd/openfactory
    binary: openfactory-runtime
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .Date }}
    # linux is the sandbox and microVM target. darwin runs the dev worker.
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: openfactory-org
    name: openfactory
  prerelease: auto
