# Test-only parts of the local stack in the namespace of-local-infra:
# PostgreSQL 16 and the git server. NOT FOR PRODUCTION.
# up.sh applies this file. It creates the Secret postgres-auth first
# (key password, from $LOCAL_DIR/db.password).
#
# Each Service is a LoadBalancer on its own port. On OrbStack every
# *.k8s.orb.local name resolves to the same node, so the port tells the
# Services apart: 5432 (db), 9418 (git).
apiVersion: v1
kind: Namespace
metadata:
  name: of-local-infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: of-local-infra
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: Never
          ports:
            - {name: pg, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: openfactory}
            - {name: POSTGRES_DB, value: openfactory}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-auth, key: password}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "openfactory", "-d", "openfactory", "-h", "127.0.0.1"]
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "openfactory", "-d", "openfactory", "-h", "127.0.0.1"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: of-local-infra
spec:
  type: LoadBalancer
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432, targetPort: 5432}
---
# The git server of LOCAL_FORGE=none. Runs clone and push over git://.
# receive-pack is on, there is no authentication: test only. The checks make
# the repositories with `git init --bare /srv/git/<repo>.git` in this container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git
  namespace: of-local-infra
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: git}
  template:
    metadata:
      labels: {app: git}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: git
          image: of-local/testkit:latest
          imagePullPolicy: Never
          command: ["git", "daemon", "--reuseaddr", "--export-all", "--enable=receive-pack", "--base-path=/srv/git", "/srv/git"]
          ports:
            - {name: git, containerPort: 9418}
          readinessProbe:
            tcpSocket: {port: 9418}
            periodSeconds: 2
          livenessProbe:
            tcpSocket: {port: 9418}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: repos, mountPath: /srv/git}
      volumes:
        - name: repos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git
  namespace: of-local-infra
spec:
  type: LoadBalancer
  selector: {app: git}
  ports:
    - {name: git, port: 9418, targetPort: 9418}
