{{- if include "openfactory.generateKey" . }}
{{- /*
Creates the master key when secretKey and existingSecret are empty. A hook Job
makes a random key and creates the Secret <fullname>-key. If the Secret exists,
the API server answers 409 and the Job keeps it. The key is never in a
rendered manifest, so `helm template` (for example in a GitOps tool) renders
the same output each time, and `helm upgrade` keeps the key. Helm does not own
the Secret: `helm uninstall` keeps it.
*/}}
{{- $name := printf "%s-key-init" (include "openfactory.fullname" .) | trunc 63 | trimSuffix "-" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "openfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: key-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
# The Job can create Secrets in the release namespace and do nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "openfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: key-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "openfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: key-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "openfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: key-init
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "openfactory.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: key-init
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.server.podSecurityContext | nindent 8 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: key-init
          image: {{ include "openfactory.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: SECRET_NAME
              value: {{ include "openfactory.keySecretName" . | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              sa=/var/run/secrets/kubernetes.io/serviceaccount
              ns=$(cat "$sa/namespace")
              key=$(head -c 32 /dev/urandom | base64)
              data=$(printf '%s' "$key" | base64 | tr -d '\n')
              body=$(printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","labels":{"app.kubernetes.io/name":"openfactory","app.kubernetes.io/instance":"%s"}},"type":"Opaque","data":{"OF_SECRET_KEY":"%s"}}' "$SECRET_NAME" {{ .Release.Name | quote }} "$data")
              if out=$(SSL_CERT_FILE="$sa/ca.crt" wget -q -O /dev/null \
                --header "Authorization: Bearer $(cat "$sa/token")" \
                --header "Content-Type: application/json" \
                --post-data "$body" \
                "https://kubernetes.default.svc/api/v1/namespaces/$ns/secrets" 2>&1); then
                echo "created Secret $SECRET_NAME with a new master key"
              elif printf '%s' "$out" | grep -q ' 409 '; then
                echo "Secret $SECRET_NAME exists: the master key is kept"
              else
                echo "cannot create Secret $SECRET_NAME: $out" >&2
                exit 1
              fi
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            {{- toYaml .Values.server.securityContext | nindent 12 }}
{{- end }}
