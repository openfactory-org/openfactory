{{- if .Values.server.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openfactory.fullname" . }}
  labels:
    {{- include "openfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.server.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.server.service.type }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openfactory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- if eq .Values.database.mode "sqlite" }}
---
# Governing Service of the SQLite-mode StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "openfactory.fullname" . }}-headless
  labels:
    {{- include "openfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openfactory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- end }}
{{- end }}
