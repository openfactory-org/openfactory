{{- if and .Values.server.enabled .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openfactory.serviceAccountName" . }}
  labels:
    {{- include "openfactory.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openfactory.workerServiceAccountName" . }}
  labels:
    {{- include "openfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
{{- end }}
