{{- if and .Values.server.enabled (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openfactory.fullname" . }}
  labels:
    {{- include "openfactory.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secretKey }}
  OF_SECRET_KEY: {{ . | quote }}
  {{- end }}
  {{- $db := include "openfactory.databaseURL" . }}
  {{- with $db }}
  OF_DATABASE_URL: {{ . | quote }}
  {{- end }}
  {{- if and .Values.oidc.enabled .Values.oidc.clientSecret (not .Values.oidc.existingSecret) }}
  OF_OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- with .Values.objectStore.signingKey }}
  OF_OBJECT_STORE_SIGNING_KEY: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.objectStore.credentials }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- range $k, $v := .Values.server.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.worker.enabled (not .Values.worker.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openfactory.fullname" . }}-worker
  labels:
    {{- include "openfactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
type: Opaque
stringData:
  api-key: {{ required "worker.apiKey (or worker.existingSecret) is required when worker.enabled is true" .Values.worker.apiKey | quote }}
  {{- range $k, $v := .Values.worker.secretEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
