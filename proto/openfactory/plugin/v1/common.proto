// Open Factory plugin protocol, version 1.
//
// Shared message types. Field numbers are stable: add new fields, never
// renumber or reuse them. A breaking change requires a new package (v2) and a
// new handshake protocol version.
syntax = "proto3";

package openfactory.plugin.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/openfactory-org/openfactory/pkg/plugin/pb;pluginv1";

message Empty {}

// Header is one HTTP header with all of its values.
message Header {
  string name = 1;
  repeated string values = 2;
}

message Actor {
  string provider = 1;
  string external_id = 2;
  string handle = 3;
  bool is_bot = 4;
  // user_id is the linked Open Factory user. The host fills it in; plugins
  // normally leave it empty.
  string user_id = 5;
}

// SourceRef identifies where a work item came from, so results return there.
message SourceRef {
  string provider = 1;
  string kind = 2; // issue, pull_request, work_item, push, pipeline, thread...
  string url = 3;
  string repo = 4;
  int64 number = 5;
  string channel = 6;
  string thread_id = 7;
  string external_id = 8;
  string title = 9;
  string thread_ref = 10; // sub-thread of the source, e.g. a review thread
}

// Event is a normalized inbound event (core.Event).
message Event {
  string id = 1; // empty: the host assigns one
  string team_id = 2;
  string factory_id = 3;
  string provider = 4;
  string type = 5;
  string delivery_id = 6;
  Actor actor = 7;
  SourceRef source = 8;
  // attributes_json is a JSON object of filterable attributes. Lists of
  // strings and integral numbers keep their Go types on the host side.
  bytes attributes_json = 9;
  bytes payload = 10; // raw provider payload (JSON), optional
  string text = 11;
  google.protobuf.Timestamp received_at = 12;
  // action_key is the same for all events of one provider action, for
  // example the events of one webhook delivery. Optional:
  // when it is empty, the host derives the key from delivery_id.
  string action_key = 13;
}

message RepoRef {
  string code_forge = 1;
  string owner = 2;
  string name = 3;
}

message PullRequestRef {
  string forge = 1;
  string repo = 2;
  int64 number = 3;
  string url = 4;
  string branch = 5;
  string state = 6; // open, draft, merged, closed
}

message CommitStatus {
  string context = 1;
  string state = 2; // pending, success, failure, error
  string description = 3;
  string target_url = 4;
}

// Integration is an integration record (core.Integration). Secrets are never
// included; secret_ref names the secret, which the plugin reads through
// Host.GetSecret.
message Integration {
  string id = 1;
  string team_id = 2;
  string provider = 3;
  string name = 4;
  map<string, string> config = 5;
  string secret_ref = 6;
  // factory_id binds the record to one factory of the team. Empty means
  // the team record.
  string factory_id = 7;
}

message OutboundMessage {
  string work_item_id = 1;
  SourceRef source = 2;
  string text = 3; // markdown
  string kind = 4; // update, question, approval_request, handoff, error
  repeated string options = 5;
  string inbox_id = 6;
  string factory_id = 7;
  string thread_ref = 8;             // reply into this sub-thread of the source
  string issue_state = 9;            // kind issue_state: in_progress, in_review, done
  PullRequestRef pull_request = 10;  // kind attach_pull_request
}
