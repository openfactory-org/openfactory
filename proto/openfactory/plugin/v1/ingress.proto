syntax = "proto3";

package openfactory.plugin.v1;

import "openfactory/plugin/v1/common.proto";

option go_package = "github.com/openfactory-org/openfactory/pkg/plugin/pb;pluginv1";

// Ingress receives inbound HTTP webhooks routed by the host
// (POST /plugins/{name}/webhook). The plugin
// verifies and normalizes the delivery; the host writes the HTTP response
// and publishes the returned events.
service Ingress {
  rpc HandleWebhook(WebhookRequest) returns (WebhookResponse);
}

message WebhookRequest {
  string method = 1;
  string path = 2;
  string raw_query = 3;
  repeated Header headers = 4;
  bytes body = 5;
  string remote_addr = 6;
  string host = 7;
}

message WebhookResponse {
  int32 status = 1; // 0 means 200
  repeated Header headers = 2;
  bytes body = 3;
  repeated Event events = 4;
}
