syntax = "proto3";

package openfactory.plugin.v1;

import "openfactory/plugin/v1/common.proto";

option go_package = "github.com/openfactory-org/openfactory/pkg/plugin/pb;pluginv1";

// Responder mirrors core.Responder: it posts factory messages back to a work
// source. One plugin may serve several providers (PluginInfo.responder_providers).
// SetIssueState and AttachPullRequest mirror core.IssueTracker. A responder
// that is not a tracker returns UNIMPLEMENTED.
service Responder {
  rpc Reply(ReplyRequest) returns (Empty);
  rpc SetIssueState(SetIssueStateRequest) returns (Empty);
  rpc AttachPullRequest(AttachPullRequestRequest) returns (Empty);
}

message ReplyRequest {
  string provider = 1;
  string team_id = 2;
  OutboundMessage message = 3;
}

message SetIssueStateRequest {
  string provider = 1;
  string team_id = 2;
  SourceRef issue = 3;
  string state = 4; // in_progress, in_review, done
}

message AttachPullRequestRequest {
  string provider = 1;
  string team_id = 2;
  SourceRef issue = 3;
  PullRequestRef pull_request = 4;
}
