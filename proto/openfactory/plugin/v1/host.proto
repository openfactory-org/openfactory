syntax = "proto3";

package openfactory.plugin.v1;

import "openfactory/plugin/v1/common.proto";

option go_package = "github.com/openfactory-org/openfactory/pkg/plugin/pb;pluginv1";

// Host is served by the Open Factory server to each plugin over the
// go-plugin broker (ConfigureRequest.host_broker_id).
//
// Access is scoped: ListIntegrations only returns records of the plugin's
// PluginInfo.integration_providers, and GetSecret / ExpandSecrets only
// resolve secrets that one of those records references (secret_ref or a
// config value whose key ends in "_ref"). Other requests fail with
// PERMISSION_DENIED.
service Host {
  rpc Log(LogRequest) returns (Empty);
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc ExpandSecrets(ExpandSecretsRequest) returns (ExpandSecretsResponse);
  rpc ListTeams(Empty) returns (ListTeamsResponse);
  rpc ListIntegrations(ListIntegrationsRequest) returns (ListIntegrationsResponse);
  rpc ListFactories(ListFactoriesRequest) returns (ListFactoriesResponse);
  rpc GetFactory(GetFactoryRequest) returns (Factory);
  rpc GetFactoryRepos(GetFactoryReposRequest) returns (GetFactoryReposResponse);
}

message LogRequest {
  string level = 1; // debug, info, warn, error
  string message = 2;
  map<string, string> attrs = 3;
}

message GetSecretRequest {
  string team_id = 1;
  string factory_id = 2;
  string name = 3;
}

message GetSecretResponse {
  bytes value = 1;
}

message ExpandSecretsRequest {
  string team_id = 1;
  string factory_id = 2;
  string text = 3; // {{SECRET_NAME}} placeholders are replaced
}

message ExpandSecretsResponse {
  string text = 1;
}

message Team {
  string id = 1;
  string name = 2;
}

message ListTeamsResponse {
  repeated Team teams = 1;
}

message ListIntegrationsRequest {
  string team_id = 1;  // empty: all teams
  string provider = 2; // empty: every provider the plugin may read
}

message ListIntegrationsResponse {
  repeated Integration integrations = 1;
}

message Factory {
  string id = 1;
  string team_id = 2;
  string alias = 3;
  string name = 4;
}

message ListFactoriesRequest {
  string team_id = 1;
}

message ListFactoriesResponse {
  repeated Factory factories = 1;
}

message GetFactoryRequest {
  string factory_id = 1;
}

message GetFactoryReposRequest {
  string factory_id = 1;
}

message GetFactoryReposResponse {
  repeated RepoRef repos = 1;
}
