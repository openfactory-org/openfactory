// Open Factory plugin protocol, version 2: the sandbox backend.
//
// This service is the only backend service.
// A backend starts one sandbox
// for one session of a run and reports its state. It does not run commands in
// the sandbox. A plugin serves this service next to the version 1
// Plugin service, which the host still uses for GetInfo, Configure and Ping.
//
// Field numbers are stable: add new fields, never renumber or reuse them.
//
// Errors use gRPC status codes:
//   NOT_FOUND           the sandbox is unknown (core.ErrNotFound)
//   INVALID_ARGUMENT    the sandbox spec is invalid (core.ErrInvalid)
//   RESOURCE_EXHAUSTED  the backend has no free slot (core.ErrAtCapacity)
//   UNAVAILABLE         a transient fault, the caller can retry
syntax = "proto3";

package openfactory.plugin.v2;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/openfactory-org/openfactory/pkg/plugin/pb/v2;pluginv2";

service SandboxBackend {
  // StartSandbox stores the spec and returns when the backend accepts it. A
  // second call with the same id returns the existing sandbox.
  rpc StartSandbox(SandboxSpec) returns (SandboxStatus);
  rpc GetSandbox(SandboxRef) returns (SandboxStatus);
  // WatchSandbox sends a status on each change until the sandbox exited.
  rpc WatchSandbox(SandboxRef) returns (stream SandboxStatus);
  // CancelSandbox asks the sandbox to stop. After grace_seconds the backend stops it.
  rpc CancelSandbox(CancelRequest) returns (Empty);
  // DestroySandbox removes the sandbox and its resources. It is safe to call two times.
  rpc DestroySandbox(SandboxRef) returns (Empty);
  // ListSandboxes returns the sandboxes that the backend holds, for the orphan sweep.
  rpc ListSandboxes(Empty) returns (SandboxList);
  // Preflight checks that the backend can start sandboxes.
  rpc Preflight(Empty) returns (Empty);
}

message Empty {}

// SandboxRef names one sandbox by the id of its spec.
message SandboxRef {
  string id = 1;
}

message CancelRequest {
  string id = 1;
  int32 grace_seconds = 2;
}

message SandboxList {
  repeated SandboxStatus sandboxes = 1;
}

// ToolImage is an image that holds a harness CLI.
message ToolImage {
  string name = 1;
  string image = 2;
}

message SandboxPlatform {
  string os = 1;
  string arch = 2;
}

message SandboxResources {
  string cpu = 1;
  string memory = 2;
}

message SandboxNetworkPolicy {
  string mode = 1;
  repeated string allowed_hosts = 2;
  repeated string denied_hosts = 3;
}

// SandboxSpec is one session of one run, as a backend receives it. The
// control plane sets id. env contains the bootstrap token, so a plugin must
// keep it out of its logs.
message SandboxSpec {
  string id = 1;
  string run_id = 2;
  int32 session = 3;
  string team_id = 4;
  string factory_id = 5;
  string image = 6;
  string runner_image = 7;
  repeated ToolImage tool_images = 8;
  SandboxPlatform platform = 9;
  SandboxResources resources = 10;
  map<string, string> env = 11;
  // network_policy is unset when the sandbox has no policy.
  SandboxNetworkPolicy network_policy = 12;
  int32 max_session_seconds = 13;
  int32 failure_retention_seconds = 14;
  string workspace_size_limit = 15;
  map<string, string> labels = 16;
}

// SandboxStatus is the state of a sandbox that a backend reports.
message SandboxStatus {
  // id is the id of the spec.
  string id = 1;
  string state = 2;  // accepted, starting, running, exited
  string reason = 3; // set when state is exited
  // exit_code is set when the main process ended.
  optional int32 exit_code = 4;
  string message = 5;
  // backend_name is the name of the sandbox in the backend, for example the
  // name of a Kubernetes pod.
  string backend_name = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp ended_at = 8;
}
