name: Release

on:
  push:
    tags: ["v*"]

# Each job asks for the permissions it needs.
permissions:
  contents: read

# Two pushes of the same tag never publish at the same time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Go tests
        run: make test-race
      - name: TypeScript tests and build
        run: |
          npm test
          npm run build

  runtime:
    name: Runtime binaries
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write   # GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sandbox-images:
    name: Sandbox images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/openfactory-org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version and tags
        id: version
        # A prerelease tag (v1.2.0-rc.1) does not move :latest.
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          for image in sandbox sandbox-cloudflare; do
            tags="${REGISTRY}/${image}:${version}"
            case "$version" in *-*) ;; *) tags="${tags},${REGISTRY}/${image}:latest" ;; esac
            echo "${image}=${tags}" >> "$GITHUB_OUTPUT"
          done
      - name: Bake the runtime into the image context
        run: |
          make build-linux VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p deploy/sandbox/runner
          for a in amd64 arm64; do
            cp "bin/linux-$a/openfactory-runtime" "deploy/sandbox/runner/openfactory-runtime-linux-$a"
          done
      - name: Sandbox image
        uses: docker/build-push-action@v6
        with:
          context: deploy/sandbox
          file: deploy/sandbox/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.sandbox }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Cloudflare sandbox image
        uses: docker/build-push-action@v6
        with:
          context: deploy/sandbox
          file: deploy/sandbox/Dockerfile.cloudflare
          build-args: SANDBOX_IMAGE=${{ env.REGISTRY }}/sandbox:${{ steps.version.outputs.value }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.version.outputs.sandbox-cloudflare }}

  kernel:
    name: Firecracker kernel
    runs-on: ubuntu-latest
    needs: runtime
    permissions:
      contents: write   # upload to the GitHub release
    steps:
      - uses: actions/checkout@v4
      - name: Build the kernel
        run: make kernel
      - name: Upload kernel artifacts and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          dir=dist/kernel
          test -d "$dir" || { echo "::error::make kernel wrote no $dir"; exit 1; }
          (cd "$dir" && sha256sum -- * | grep -v 'kernel-checksums.txt' > kernel-checksums.txt)
          gh release upload "$GITHUB_REF_NAME" "$dir"/* --clobber

  npm:
    name: npm packages
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version -w openfactory -w @openfactory/control-plane
      - run: npm run build
      - name: Publish the CLI and the control plane
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish --access public --provenance --tag "$tag" -w openfactory -w @openfactory/control-plane
