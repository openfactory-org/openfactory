name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: the Firecracker job.
    - cron: "17 3 * * *"

permissions:
  contents: read

# A new push to a pull request cancels its older runs. Runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: TypeScript checks
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Generated files are up to date
        run: npm run gen:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Validate example definitions
        run: npm run validate-examples
      - name: Test ledger covers every deleted Go test
        run: npm run check:ledger

  contract:
    name: Contract suite
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build the runtime
        run: make build
      - run: npm ci
      # wrangler dev serves web/dist as Static Assets; it must exist.
      - name: Build the dashboard
        run: npm run build -w @openfactory/web
      # wrangler dev, the local provider, a fake runner and one real Go runner run.
      - name: Contract suite
        run: npm run contract

  go:
    name: Go runtime
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format, vet, race tests, linux builds, naming, package list, removed dependencies
        run: make fmt-check vet test-race build-linux naming go-allowlist go-deps-check

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned so a new linter release does not fail unchanged code.
          version: v2.15.0

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - name: govulncheck
        run: make vuln

  npm-audit:
    name: npm audit (report only)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: npm audit
        continue-on-error: true
        run: npm audit --omit=dev

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      # The ubuntu runner image includes shellcheck.
      - name: shellcheck
        run: make shellcheck

  # The REST API becomes a stable contract with the tag v1.0.0. Until then
  # the diff against the committed baseline only reports: it shows the changes
  # in the job summary and never fails the build. The check that the baseline
  # file exists and is valid still fails the build.
  # When v1.0.0 is tagged, set OPENAPI_ENFORCE to "1" here and in the Makefile.
  # Then a breaking change fails the build. Regenerate the baseline
  # (make openapi-baseline) when a release is cut.
  openapi:
    name: OpenAPI diff (report only until v1.0.0)
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    env:
      OPENAPI_ENFORCE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: oasdiff breaking
        run: |
          set +e
          make openapi-check > oasdiff.txt 2>&1
          status=$?
          cat oasdiff.txt
          {
            echo '### OpenAPI diff against the baseline'
            if [ "$OPENAPI_ENFORCE" = "1" ]; then echo '(enforced: a breaking change fails the build)'; else echo '(report only until v1.0.0)'; fi
            echo '```'
            cat oasdiff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  images:
    name: Sandbox images build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-buildx-action@v3
      # The image bakes in the runtime binary when deploy/sandbox/runner has it.
      - name: Build the runtime for linux/amd64
        run: |
          make build-linux LINUX_ARCHES=amd64
          mkdir -p deploy/sandbox/runner
          cp bin/linux-amd64/openfactory-runtime deploy/sandbox/runner/openfactory-runtime-linux-amd64
      - name: Sandbox image
        uses: docker/build-push-action@v6
        with:
          context: deploy/sandbox
          file: deploy/sandbox/Dockerfile
          platforms: linux/amd64
          load: true
          tags: openfactory-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The base image was only loaded into the local Docker daemon. The
      # buildx container builder cannot see it, so use the Docker builder.
      - name: Cloudflare sandbox image
        uses: docker/build-push-action@v6
        with:
          builder: default
          context: deploy/sandbox
          file: deploy/sandbox/Dockerfile.cloudflare
          build-args: SANDBOX_IMAGE=openfactory-sandbox:ci
          platforms: linux/amd64
          push: false
      - name: Smoke checks
        run: IMAGE_TAG=ci SANDBOX_IMAGE=openfactory-sandbox sh scripts/images/build.sh smoke sandbox

  # Runs nightly and on pull requests with the label e2e-firecracker.
  # The runner needs /dev/kvm: check that the chosen runner offers it.
  firecracker:
    name: Firecracker end-to-end
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e-firecracker'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check for KVM
        run: |
          test -c /dev/kvm || { echo "::error::/dev/kvm is not available on this runner"; exit 1; }
          sudo chmod 666 /dev/kvm
      - name: Kernel and end-to-end tests
        run: make kernel e2e-firecracker
