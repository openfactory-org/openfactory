name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security problems here. Follow [SECURITY.md](https://github.com/openfactory-org/openfactory/blob/main/SECURITY.md).
        Remove secrets, tokens and private data from everything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. Include the error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps, definition files or commands that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Open Factory version
      description: The output of `openfactory version`, the image tag or the commit.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install mode
      options:
        - Deployed to Cloudflare (wrangler deploy)
        - Local development (wrangler dev)
        - Custom control plane build
        - Other
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Sandbox provider
      options:
        - cloudflare-sandbox
        - daytona
        - boatdev
        - MicroVM worker
        - Development process worker (local)
        - Plugin provider
        - Not applicable
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - claude
        - codex
        - Not applicable
  - type: input
    id: model
    attributes:
      label: Model
      description: The model of the agent, if the problem involves a run.
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system and architecture of the host, for a bug on a worker or in the CLI. Include the Node.js version for a CLI bug.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Control plane (`wrangler tail`), worker or runner logs around the failure. Remove secrets.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Other context
