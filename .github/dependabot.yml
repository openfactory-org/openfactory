version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /
      - /examples/custom-binary
      - /examples/plugin-hello
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /deploy/docker
      - /deploy/sandbox
      - /deploy/aws-local
      - /deploy/local/testkit
      - /images/tool-claude
      - /images/tool-codex
      - /images/tool-example
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
