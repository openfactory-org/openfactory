# yaml-language-server: $schema=https://openfactory-org.github.io/schemas/v1/factory.schema.json
schemaVersion: v1
name: code-review
description: Reviews every pull request opened against main; never writes code.
alias: reviewbot
repositories:
  - owner: acme
    name: api-service
  - owner: acme
    name: web-app
networkPolicy: {}
agentDefaults:
  harness:
    type: claude
    model: claude-opus-5-5
    auth:
      source: managedSecret
      secretName: ANTHROPIC_API_KEY
