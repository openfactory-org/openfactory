# yaml-language-server: $schema=https://openfactory-org.github.io/schemas/v1/machine.schema.json
description: macOS machine with Xcode and simulators for the iOS app
setupCommands:
  - xcodebuild -version
  - brew bundle --file=ios-app/Brewfile
instanceShape:
  vcpus: 8
  memoryGb: 14
failureSessionRetentionMinutes: 30
platform:
  os: macos
  arch: aarch64
  mac:
    version: "26"
