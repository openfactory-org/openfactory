# yaml-language-server: $schema=https://openfactory-org.github.io/schemas/v1/benchmark_suite.schema.json
name: Implementation quality
description: Compare implement-agent configurations on representative web tasks.
agent: implement
configurations:
  - name: Baseline
    agents:
      - agent: implement
        model: claude-opus-5-5
  - name: Codex
    agents:
      - agent: implement
        harness:
          type: codex
          model: gpt-5.3-codex
          auth:
            source: managedSecret
            secretName: OPENAI_API_KEY
tasks:
  - fix-date-formatting
  - add-empty-state
