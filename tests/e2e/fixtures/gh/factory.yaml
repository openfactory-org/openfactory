# Factory of the GitHub checks. It works on the test repository
# __GITHUB_OWNER__/__GITHUB_NAME__. The agent has the token GITHUB_TOKEN as an
# environment variable, so that it can run gh.
schemaVersion: v1
name: of-local-gh
alias: of-local-gh
description: Factory of the GitHub checks.
repositories:
  - owner: __GITHUB_OWNER__
    name: __GITHUB_NAME__
automations:
  githubOnboardingNotices: false
secrets:
  - GITHUB_TOKEN
agentDefaults:
  model: claude-sonnet-5-5
